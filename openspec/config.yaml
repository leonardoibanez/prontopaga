schema: spec-driven

sdd:
  artifact_store: hybrid

context: |
  Workspace: npm workspaces backend and frontend; Node >=24 <25.
  Backend: NestJS 11.2.3, Express, TypeScript 5.9.3, CommonJS, strict compiler.
  Frontend: explicitly deferred; this stage must not modify or integrate it.
  Architecture: GET /api/health is public; POST /login and protected GET /score/:rut are literal root routes. Authentication uses three synthetic identities and HS256 tokens; score access is owner-or-admin and responses are no-store.
  Scope: backend-delivery stage 5 only; backend regression evidence, focused error/credential-exposure review, and fresh-developer backend-only documentation.
  Testing: root npm test delegates to backend build and all 30 node:test tests; acceptance also runs backend-only build and typecheck. Final backend-delivery evidence observed all four exact commands passing with 30 tests.
  Delivery: exception-ok with no chain; one conventional commit is authorized at close. No push, PR, receipt-driven review, or frontend work is authorized.
  Artifacts: SDD artifacts are English; extend the repository's Spanish documentation convention.

strict_tdd: true
testing:
  detected: "2026-09-04"
  scope: backend-delivery
  in_scope_projects: [backend]
  deferred_projects: [frontend]
  test_command: npm test
  command_cwd: workspace-root
  strict_tdd: true
  rationale: >-
    The root test script covers every in-scope backend suite. Documentation-only
    edits use structural readback; any discovered runtime regression requires a
    behavioral failing test followed by RED, GREEN, and REFACTOR.
  runtime:
    required: ">=24 <25"
    verified_version: 24.20.0
    executable: portable Node 24 runtime (verified 24.20.0)
    invocation: 'PATH="<node-24-bin>:$PATH" npm test'
    note: Verification used Node 24.20.0 from a temporary runtime path; the path is environment-specific and is not a required global location. No global environment changes were made.
  execution_evidence: Backend-delivery final evidence reports 30 passing backend tests and four exact root-scoped commands passed: npm run build -w backend, npm run typecheck -w backend, npm test -w backend, and npm test.
  coverage_command: null
  coverage_threshold: null
  projects:
    - path: backend
      in_scope: true
      stack: NestJS 11 / Express / TypeScript / CommonJS
      test_command: npm run test -w backend
      test_script: npm run build && node --test test/*.test.cjs
      runner: node:test
      test_layers:
        unit: RUT parsing/validation and deterministic synthetic scoring.
        integration: Bootstrap, health, login, bearer authentication, authorization, error ordering, and score HTTP contracts.
        e2e: No separate E2E harness configured.
      coverage_command: null
      lint_command: null
      typecheck_command: npm run typecheck -w backend
      build_command: npm run build -w backend
      formatter_command: null
    - path: frontend
      in_scope: false
      reason: Explicitly deferred; no frontend changes or verification are authorized.
      stack: Next.js 16 App Router / React 19 / TypeScript
      test_command: null
      runner: null
      coverage_command: null
      lint_command: npm run lint -w frontend
      typecheck_command: npm run typecheck -w frontend
      build_command: npm run build -w frontend
      formatter_command: null

rules:
  proposal:
    - Limit work to backend delivery evidence, focused error/credential-exposure review, and backend-only local setup documentation.
    - Document Node 24, npm workspaces, local JWT_SECRET generation, workspace startup, synthetic accounts, exact curl examples, the PDF RUT typo, SHA-256 goldens, UTC fecha, and the required AI-use declaration.
    - Exclude database, real financial scoring, production authentication, SSO, multitenancy, deployment, frontend integration, and speculative hardening or large libraries.
    - Preserve the original PDF, .gitignore, and frontend.
  specs:
    - Use RFC 2119 requirements and Given/When/Then scenarios.
    - Require a requirements-to-real-test evidence matrix without claiming coverage or complete security.
  design:
    - Prefer documentation-only delivery unless review demonstrates a concrete backend contract defect.
    - Keep secrets out of tracked files and use only isolated temporary smoke environments with cleanup.
    - Any runtime fix must be minimal, preserve existing dependencies and architecture, and follow strict TDD.
  tasks:
    - Separate documentation, regression evidence, focused review, and final delivery into reviewable units.
    - Include a Review Workload Forecast before apply.
  apply:
    guidelines:
      - Documentation-only work requires structural readback, not an artificial RED test.
      - Any code bug fix requires strict RED-GREEN-REFACTOR; Standard Mode is forbidden.
      - Do not modify a real .env; any smoke environment must be temporary and cleaned up.
      - Create one conventional commit only at close; do not push, open a PR, activate receipt-driven review, or touch frontend.
    tdd: true
    test_command: npm test
  verify:
    test_command: npm test
    build_command: npm run build -w backend
    guidelines:
      - Also run npm run typecheck -w backend and npm test -w backend.
      - Report exact backend evidence and limitations; no coverage threshold exists and no security-complete claim is allowed.
  archive:
    - Record final command evidence, reviewed surfaces, limitations, and the closing commit.
    - Archive only after all required verification succeeds.
